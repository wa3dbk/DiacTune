[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diac-ft"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "datasets>=3.0",
    "camel-tools>=1.6",
    "diacritization-evaluation>=0.5",
    "typer>=0.12",
    "omegaconf>=2.3",
]

[project.scripts]
diac = "diac.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]
