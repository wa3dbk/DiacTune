[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diactune"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
description = "Unified CLI for Arabic diacritization — inference, fine-tuning, and evaluation across multiple backends"
keywords = ["arabic", "diacritization", "tashkeel", "nlp", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Arabic",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "datasets>=3.0",
    "camel-tools>=1.6",
    "diacritization-evaluation>=0.5",
    "typer>=0.12",
    "omegaconf>=2.3",
]

[project.urls]
Homepage = "https://github.com/wa3dbk/DiacTune"
Issues = "https://github.com/wa3dbk/DiacTune/issues"

[project.scripts]
diactune = "diac.cli:app"

[project.optional-dependencies]
rababa = []
catt   = ["pytorch_lightning>=2.0", "kaldialign"]
dev    = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that hit the network or load large models (deselect with '-m not slow')",
]

[tool.hatch.build.targets.wheel]
packages = ["diac"]
